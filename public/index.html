<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#da291c">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Mikes · Horaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- Drop the official logo at public/logo.png (or logo.svg + update src) to replace the text wordmark. -->
      <img id="logo" src="logo.png" alt="Toujours Mikes" height="52" onerror="this.hidden=true;document.getElementById('wordmark').hidden=false">
      <span id="wordmark" class="wordmark" hidden>Mikes</span>
    </div>
    <nav class="tabs" id="main-tabs" aria-label="Navigation"></nav>
    <button id="lang-toggle" class="chip" type="button"></button>
    <button id="fs-toggle" class="chip desktop-chip" type="button"></button>
  </header>
  <main id="app" aria-live="polite"></main>
  <dialog id="modal"></dialog>
</body>
</html>
